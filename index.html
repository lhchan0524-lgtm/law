<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>생활법률 합동상담 콘솔</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light;
  --font:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --bg:#F2F4F6; --surface:#fff; --s2:#F9FAFB; --fill:#F2F4F6; --line:#EEF0F2; --line2:#DDE1E5;
  --t1:#191F28; --t2:#4E5968; --t3:#8B95A1; --t4:#B0B8C1;
  --brand:#185ABD; --brand-h:#144FA8; --soft:#E8F0FB; --ink:#103F91; --deep:#0E3270;
  --warn:#B25E00; --warn-soft:#FFF2D9; --bad:#E42939; --ok:#1B7F4B; --hl:#FFF200;
  --r0:#1f4e8c; --r1:#8c1f2b; --r2:#2c6b3f; --r3:#8a5a12;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased;}
[hidden]{display:none!important;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.num{font-variant-numeric:tabular-nums;}
mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;font-weight:800;padding:0 .08em;}

/* ───────── 콘솔 ───────── */
.ctop{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;}
.ctop-in{max-width:76rem;margin:0 auto;padding:.7rem 1.2rem;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;}
.logo{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.05rem;}
.logo::before{content:"¶";display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#fff;color:var(--brand);font-weight:800;}
.grow{flex:1;}
.dot{display:inline-flex;align-items:center;gap:.35rem;font-size:.8rem;background:rgba(255,255,255,.15);border-radius:999px;padding:.2rem .7rem;}
.dot::before{content:"";width:8px;height:8px;border-radius:50%;background:#FFD24D;}
.dot.online::before{background:#5BE49B;} .dot.error::before,.dot.offline::before{background:#FF8A8A;}
.tbtn{border:0;border-radius:10px;background:#fff;color:var(--brand);font-weight:800;padding:.45rem .9rem;font-size:.88rem;}
.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:3.1rem;z-index:15;}
.tabs-in{max-width:76rem;margin:0 auto;padding:0 1.2rem;display:flex;gap:.2rem;overflow-x:auto;}
.tabs button{border:0;background:none;padding:.75rem 1rem;font-weight:700;color:var(--t3);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tabs button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);}
.warnbar{background:var(--warn-soft);color:var(--warn);font-weight:700;}
.warnbar .in{max-width:76rem;margin:0 auto;padding:.55rem 1.2rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;font-size:.9rem;}
main.c{max-width:76rem;margin:0 auto;padding:1rem 1.2rem 4rem;}
.card{background:var(--surface);border-radius:18px;padding:1.15rem 1.25rem;margin-bottom:1rem;}
.card h2{margin:0 0 .6rem;font-size:1.05rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem;}
.card h2 small{font-weight:500;color:var(--t3);font-size:.82rem;}
.note{font-size:.84rem;color:var(--t3);} .note.warn{color:var(--warn);font-weight:600;} .note.ok{color:var(--ok);font-weight:600;}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;border:0;height:2.5rem;padding:0 1rem;border-radius:11px;background:var(--fill);font-weight:700;font-size:.9rem;text-decoration:none;color:var(--t1);}
.btn.primary{background:var(--brand);color:#fff;} .btn.primary:hover{background:var(--brand-h);}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);color:var(--t2);}
.btn.danger{background:#FDECEC;color:var(--bad);} .btn.sm{height:2rem;padding:0 .7rem;font-size:.8rem;border-radius:9px;}
.btn.lg{height:3rem;font-size:1rem;padding:0 1.4rem;border-radius:13px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px;}
.seg button{border:0;background:none;border-radius:9px;padding:.4rem .85rem;font-weight:700;font-size:.86rem;color:var(--t3);}
.seg button[aria-pressed="true"]{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08);}
input.txt,textarea.txt,select.txt{width:100%;border:1.5px solid var(--line2);border-radius:10px;padding:.5rem .7rem;background:#fff;font-size:.9rem;}
textarea.txt{min-height:5.5rem;resize:vertical;line-height:1.55;}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1rem;align-items:start;}
@media (max-width:900px){.grid2{grid-template-columns:1fr;}}

.stepnow{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:.8rem;}
.stepnow b{font-size:1.45rem;letter-spacing:-.03em;} .stepnow small{display:block;color:var(--t3);font-weight:600;font-size:.82rem;}
.steps{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem;}
.steps button{border:0;border-radius:999px;padding:.35rem .8rem;font-size:.82rem;font-weight:700;background:var(--fill);color:var(--t3);}
.steps button.done{background:var(--soft);color:var(--ink);} .steps button.now{background:var(--brand);color:#fff;}
.clock{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1;}
.clock.low{color:var(--warn);} .clock.zero{color:var(--bad);}
.kv{display:grid;grid-template-columns:7rem 1fr;gap:.45rem .8rem;align-items:center;font-size:.9rem;}
.kv > span{color:var(--t3);font-weight:600;font-size:.84rem;}

.subgrid{display:grid;grid-template-columns:5.2rem repeat(4,minmax(0,1fr));gap:.4rem;}
.subgrid .h{font-size:.78rem;font-weight:800;text-align:center;padding:.3rem 0;}
.subgrid .g{font-weight:800;font-size:.9rem;display:flex;flex-direction:column;justify-content:center;}
.subgrid .g small{font-weight:500;color:var(--t3);font-size:.76rem;}
.cell{border:0;border-radius:11px;background:var(--fill);padding:.45rem .55rem;text-align:left;min-height:3.6rem;display:flex;flex-direction:column;gap:.1rem;font-size:.84rem;}
.cell b{font-size:.88rem;} .cell span{font-size:.72rem;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cell.ok{background:#E9F6EE;} .cell.ok span{color:var(--ok);font-weight:700;}
.cell.sel{box-shadow:inset 0 0 0 2px var(--brand);}
.cell.none{color:var(--t4);}
.badge{display:inline-flex;align-items:center;font-size:.7rem;font-weight:800;border-radius:6px;padding:.05rem .4rem;background:var(--fill);color:var(--t2);margin-right:.2rem;}
.badge.ok{background:#E9F6EE;color:var(--ok);} .badge.warn{background:var(--warn-soft);color:var(--warn);} .badge.blue{background:var(--soft);color:var(--ink);} .badge.bad{background:#FDECEC;color:var(--bad);}

.revgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;}
@media (max-width:1000px){.revgrid{grid-template-columns:repeat(2,minmax(0,1fr));}}
.rcol{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);overflow:hidden;}
.rcol h3{margin:0;padding:.5rem .7rem;font-size:.88rem;background:#F7F8FA!important;border-top:3px solid;border-bottom:1px solid #E5E8EC;min-height:3.6rem;}
.rcol h3 small{display:block;font-weight:500;font-size:.72rem;color:var(--t2);}
.rcol .in{padding:.5rem;display:grid;gap:.35rem;}
.tg{border:0;border-radius:9px;background:var(--fill);padding:.4rem .55rem;text-align:left;font-size:.8rem;display:flex;justify-content:space-between;gap:.4rem;align-items:center;}
.tg em{font-style:normal;font-weight:800;font-size:.68rem;padding:.05rem .4rem;border-radius:5px;background:#fff;color:var(--t3);flex:none;}
.tg.on{background:var(--soft);color:var(--ink);font-weight:700;} .tg.on em{background:var(--brand);color:#fff;}

.detail{border-top:1px solid var(--line);margin-top:1rem;padding-top:1rem;}
.op h4{margin:.7rem 0 .2rem;font-size:.78rem;color:var(--t3);}
.op p{margin:0;font-size:.92rem;line-height:1.6;white-space:pre-wrap;}
.tags{display:flex;flex-wrap:wrap;gap:.35rem;margin:.3rem 0 .6rem;}
.tags button{border:0;border-radius:999px;padding:.35rem .75rem;font-size:.8rem;font-weight:700;background:var(--fill);color:var(--t2);}
.tags button[aria-pressed="true"]{background:var(--brand);color:#fff;}
table.t{width:100%;border-collapse:collapse;font-size:.86rem;}
table.t th,table.t td{padding:.45rem .55rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
table.t th{font-size:.76rem;color:var(--t3);font-weight:700;}
.qrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;}
@media (max-width:900px){.qrs{grid-template-columns:1fr;}}
.qrc{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);padding:.8rem;display:flex;flex-direction:column;gap:.45rem;}
.qrc b{font-size:.95rem;} .qrc .qr{width:130px;height:130px;align-self:center;} .qrc .qr svg{width:100%;height:100%;}
.qrc input{font-size:.78rem;}
.stu{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line2);margin-bottom:.5rem;overflow:hidden;}
.stu > button{width:100%;border:0;background:#fff;display:flex;gap:.6rem;align-items:center;padding:.6rem .8rem;text-align:left;}
.stu > button b{font-size:.95rem;} .stu > button .r{font-size:.8rem;font-weight:700;}
.stu .body{padding:.2rem .9rem .9rem;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:1rem;}
@media (max-width:900px){.stu .body{grid-template-columns:1fr;}}
.cnt{font-size:.74rem;color:var(--t3);display:flex;gap:.6rem;justify-content:space-between;margin:.25rem 0;}
.cnt.over{color:var(--bad);font-weight:700;}

/* ───────── 공지 화면 (TV) — 관공서 안내 화면처럼 납작하고 단정하게 ───────── */
body.board{background:#E9EDF2;overflow:hidden;height:100vh;font-size:clamp(7px,min(1.2vw,2.13vh),30px);}
body.board #board{display:flex;flex-direction:column;height:100vh;}
.bhead{background:#fff;display:flex;align-items:center;gap:1em;padding:0 1.6em;height:4.2em;border-bottom:3px solid var(--brand);flex:none;}
.bhead .nm{font-weight:800;font-size:1.35em;color:var(--deep);letter-spacing:-.03em;display:flex;align-items:center;gap:.45em;}
.bhead .nm::before{content:"¶";display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:3px;background:var(--brand);color:#fff;font-size:.85em;}
.bhead .sub{font-size:.95em;color:var(--t2);padding-left:1em;border-left:1px solid #CFD6DF;}
.bhead .meta{margin-left:auto;font-size:.9em;color:var(--t3);text-align:right;line-height:1.35;}
.bnav{display:flex;background:#F7F8FA;border-bottom:1px solid #D5DBE3;flex:none;padding:0 1.6em;}
.bnav span{flex:1;text-align:center;padding:.55em .3em;font-size:.88em;font-weight:600;color:#8D97A5;border-right:1px solid #E1E5EB;white-space:nowrap;}
.bnav span:first-child{border-left:1px solid #E1E5EB;}
.bnav span.d{color:#4E5968;} .bnav span.d::before{content:"✓ ";color:var(--brand);}
.bnav span.c{background:var(--brand);color:#fff;font-weight:800;}
.bmain{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 21em;gap:1em;padding:1em 1.6em 1.2em;}
.bstage{background:#fff;border:1px solid #D5DBE3;border-top:4px solid var(--deep);display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.bstage .lab{display:flex;justify-content:space-between;align-items:center;padding:.55em 1.6em;border-bottom:1px solid #E5E8EC;font-size:.9em;color:var(--t3);font-weight:600;flex:none;}
.bstage .lab b{color:var(--brand);}
.fitbox{flex:1;min-height:0;padding:1.1em 1.6em 1.2em;overflow:hidden;}
.fit h1{font-size:2.5em;margin:0 0 .45em;letter-spacing:-.035em;line-height:1.2;color:var(--t1);}
.fit .say{font-size:1.45em;font-weight:700;color:var(--ink);margin:0 0 .9em;padding-left:.7em;border-left:4px solid var(--brand);line-height:1.4;}
.fit ol{margin:0;padding:0;list-style:none;counter-reset:n;}
.fit ol li{counter-increment:n;display:grid;grid-template-columns:1.9em 1fr;gap:.7em;align-items:baseline;font-size:1.4em;line-height:1.45;padding:.5em 0;border-bottom:1px solid #EEF0F3;}
.fit ol li:last-child{border-bottom:0;}
.fit ol li::before{content:counter(n);display:grid;place-items:center;height:1.55em;background:#EEF3FA;color:var(--brand);font-weight:800;font-size:.8em;border:1px solid #C9D8EE;}
.fit mark{background:none;color:var(--ink);font-weight:800;padding:0;}
.fit .ph{font-size:1.9em;font-weight:800;margin:0 0 .5em;letter-spacing:-.03em;color:var(--t1);}
.fit .ph small{font-weight:600;color:var(--t3);font-size:.55em;margin-left:.5em;letter-spacing:0;}
table.ans{width:100%;border-collapse:collapse;table-layout:fixed;}
table.ans th,table.ans td{border:1px solid #D5DBE3;padding:.5em .7em;vertical-align:top;text-align:left;line-height:1.42;}
table.ans thead th{background:#F4F6F9;font-size:1.05em;border-top-width:4px;}
table.ans thead th b{display:block;}
table.ans thead th span{display:block;font-weight:500;font-size:.78em;color:var(--t2);margin-top:.15em;}
table.ans tbody th{width:6.2em;background:#F7F8FA;font-size:.82em;color:var(--t2);font-weight:700;}
table.ans td{font-size:.95em;}
table.ans td.miss{color:#C4202F;}
table.ans td.wait{color:#B7BEC8;text-align:center;vertical-align:middle;}
.xs{display:grid;grid-template-columns:1fr 1fr;gap:.8em;margin-top:.8em;}
.xs div{border:1px solid #C9D8EE;background:#F5F8FD;padding:.5em .8em;font-size:.95em;line-height:1.45;}
.xs b{display:block;font-size:.82em;color:var(--ink);margin-bottom:.1em;}
.bside{display:flex;flex-direction:column;gap:.8em;min-height:0;overflow:hidden;}
.bbox{background:#fff;border:1px solid #D5DBE3;flex:none;}
.bbox h3{margin:0;padding:.5em .9em;font-size:.88em;color:var(--t2);background:#F7F8FA;border-bottom:1px solid #E5E8EC;display:flex;justify-content:space-between;}
.bbox h3 small{font-weight:600;color:var(--t3);}
.bbox ol.how{margin:0;padding:.45em .9em .55em 2.1em;font-size:.86em;line-height:1.45;color:var(--t2);} .bbox ol.how li{padding:.2em 0;} .bbox ol.how mark{background:none;color:var(--ink);font-weight:800;}
.btimer{padding:.6em .9em .75em;text-align:center;}
.btimer b{display:block;font-size:4.4em;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--deep);}
.btimer.low b{color:#C26A00;} .btimer.zero b{color:#C4202F;}
.bar{height:.45em;background:#E5E9EF;margin-top:.6em;} .bar i{display:block;height:100%;background:var(--brand);transition:width .9s linear;}
.btimer.low .bar i{background:#E08A00;} .btimer.zero .bar i{background:#C4202F;}
.bnext{padding:.55em .9em;border-top:1px solid #E5E8EC;font-size:.86em;color:var(--t3);text-align:left;}
.bnext b{color:var(--t1);}
table.bsub{width:100%;border-collapse:collapse;font-size:.9em;}
table.bsub th,table.bsub td{border-bottom:1px solid #EEF0F3;padding:.36em .3em;text-align:center;}
table.bsub th{font-size:.78em;color:var(--t3);font-weight:600;}
table.bsub td:first-child,table.bsub th:first-child{text-align:left;padding-left:.9em;font-weight:700;color:var(--t1);}
table.bsub td i{font-style:normal;display:inline-block;width:1.4em;height:1.4em;line-height:1.4em;font-size:.8em;background:#EEF0F3;color:transparent;}
table.bsub td i.ok{background:var(--brand);color:#fff;}
table.bsub td.n{font-size:.8em;color:var(--t3);font-weight:600;}
.border{list-style:none;margin:0;padding:0;}
.border li{display:flex;gap:.6em;align-items:center;padding:.42em .9em;border-bottom:1px solid #EEF0F3;font-size:.92em;}
.border li:last-child{border-bottom:0;}
.border li b{width:2.6em;flex:none;} .border li span{color:var(--t2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.border li em{font-style:normal;font-size:.75em;font-weight:700;color:var(--t3);}
.border li.c{background:#EEF3FA;} .border li.c b,.border li.c em{color:var(--brand);}
.border li.d span,.border li.d b{color:#A4ADB9;}
.bqr{position:fixed;inset:0;z-index:50;background:rgba(18,32,58,.88);display:grid;place-items:center;}
.bqr .box{background:#fff;border-top:6px solid var(--brand);padding:2.2em 2.8em;display:flex;gap:2.6em;align-items:center;max-width:90vw;}
.bqr .qr{width:min(44vh,26em);height:min(44vh,26em);} .bqr .qr svg{width:100%;height:100%;}
.bqr small{font-size:1em;color:var(--brand);font-weight:700;}
.bqr h2{margin:.15em 0 .4em;font-size:2.4em;letter-spacing:-.03em;color:var(--t1);}
.bqr ol{margin:0 0 1em;padding-left:1.2em;font-size:1.2em;color:var(--t2);line-height:1.6;}
.bqr .url{font-size:.9em;color:var(--t3);word-break:break-all;border-top:1px solid #E5E8EC;padding-top:.7em;}
/* ───────── 콘솔: 둥근 카드 대신 업무용 화면처럼 ───────── */
body:not(.board){background:#EEF1F5;}
.card{border-radius:6px;box-shadow:none;border:1px solid #D9DEE5;}
.card h2{padding-bottom:.55rem;border-bottom:1px solid #EEF0F3;margin-bottom:.8rem;}
.btn{border-radius:5px;} .btn.sm{border-radius:4px;} .btn.lg{border-radius:6px;}
.seg,.seg button{border-radius:4px;}
.steps{gap:0;border:1px solid #D9DEE5;border-radius:4px;overflow:hidden;}
.steps{flex-wrap:nowrap;} .steps button{border-radius:0;background:#fff;border-right:1px solid #E5E8EC;padding:.45rem .3rem;flex:1 1 0;font-size:.76rem;white-space:nowrap;}
.steps button:last-child{border-right:0;} .steps button.done{background:#F5F8FC;}
.cell,.tg,.rcol,.qrc,.stu,input.txt,textarea.txt,select.txt{border-radius:4px;}
.cell{background:#F7F8FA;border:1px solid #E5E8EC;} .cell.ok{background:#F1F8F4;border-color:#CDE6D6;}
.badge{border-radius:3px;}
.tags button{border-radius:4px;}
.dot{border-radius:3px;}
.logo::before{border-radius:3px;}
.tbtn{border-radius:4px;}
@media print{.ctop,.tabs,.warnbar,.noprint{display:none!important;} body{background:#fff;} .card{box-shadow:none;}}
</style>
</head>
<body>
<div id="console">
  <header class="ctop"><div class="ctop-in"><span class="logo">생활법률 합동상담 콘솔</span><span class="dot" id="link">연결 중</span><span class="grow"></span>
    <span class="note" style="color:rgba(255,255,255,.8)" id="roomTxt"></span><button class="tbtn" id="btnBoard">공지 화면 열기</button></div></header>
  <div class="warnbar" id="solBar" hidden><div class="in">해설 없음 — 해설.json을 불러와야 해설 공개를 할 수 있습니다. <label class="btn sm primary">해설 불러오기<input type="file" accept=".json,application/json" class="solFile" hidden></label></div></div>
  <nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
  <main class="c" id="view"></main>
</div>

<div id="board" hidden>
  <div class="bhead"><span class="nm">생활법률 합동상담</span><span class="sub">법률 · 세무 합동 상담소</span><span class="meta" id="bMeta"></span></div>
  <div class="bnav" id="bNav"></div>
  <div class="bmain">
    <div class="bstage"><div class="lab"><span id="bLab"></span><span id="bLab2"></span></div><div class="fitbox" id="bFitBox"><div class="fit" id="bStage"></div></div></div>
    <div class="bside">
      <div class="bbox"><h3>남은 시간 <small id="bTot"></small></h3><div class="btimer" id="bTimer"><b id="bTime">—</b><div class="bar"><i id="bBar" style="width:100%"></i></div></div><div class="bnext" id="bNext"></div></div>
      <div class="bbox" id="bSideBox"></div>
      <div class="bbox" id="bSideBox2"></div>
    </div>

(function () {

  function qrPng(text, title, file) {

  function boardTick() {

  /* 무대 글자 크기를 칸에 꼭 맞게 — 넘치지도, 크게 비지도 않도록 */

      '<div class="kv"><span>타이머</span><div class="row"><span class="clock num ' + (!t ? '' : left <= 0 ? 'zero' : left <= 60 ? 'low' : '') + '" id="cClock">' + (t ? fmt(left) : '—') + '</span>' +
        '<button class="btn primary" id="tGo">' + (t && t.run ? '멈춤' : '시작') + '</button><button class="btn" id="tRe">다시</button><button class="btn" id="tPl">+1분</button>' +
        [1, 2, 3, 12, 25].map((m) => '<button class="btn ghost sm tSet" data-m="' + m + '">' + m + '분</button>').join('') + '</div>' +
      '<span>공지 QR</span><div class="seg" id="qrSeg">' + [['off', '끔'], ['student', '의견서 작성기'], ['reflect', '성찰 과제']].map(([k, n]) => '<button data-q="' + k + '" aria-pressed="' + (s.qr === k) + '">' + n + '</button>').join('') + '</div>' +

          '<textarea class="txt dr" data-sid="' + S.sid + '" data-k="career" style="min-height:10rem">' + esc(d.career) + '</textarea></div></div>' : '') + '</div>';
    }).join('') : '<p class="note">신청 명단이 있어야 학생 기록이 생깁니다.</p>') + '</section>';
    h += '<section class="card"><h2>명단 · 개인 기록 모두 지우기</h2><p class="note">담임 선생님께 드린 뒤 누르세요. 파이어베이스의 신청 명단·성찰과, 이 브라우저의 관찰·초안이 함께 지워집니다. 의견서와 보고서는 [설정]의 진행 초기화로 지웁니다.</p><div class="row"><button class="btn danger" id="bAllWipe">모두 지우기</button><span class="note" id="awNote"></span></div></section>';
    el('view').innerHTML = h;
    el('when').oninput = function () { T.when = this.value; saveT(); };
    el('when').onchange = () => render(true);
    el('cls').onchange = function () { recCls = this.value; render(true); };
    el('view').querySelectorAll('.stu > button').forEach((b) => b.onclick = () => { openStu[b.dataset.sid] = !openStu[b.dataset.sid]; render(true); });
    bindObs(el('view'));
    el('view').querySelectorAll('.tags button').forEach((b) => { const f = b.onclick; b.onclick = function () { f.call(this); render(true); }; });
    el('view').querySelectorAll('.fol').forEach((x) => { x.oninput = function () { T.follow[this.dataset.sid] = this.value; saveT(); }; x.onchange = () => render(true); });
    el('view').querySelectorAll('.obsMemo').forEach((x) => x.onchange = () => render(true));
    el('view').querySelectorAll('.dr').forEach((x) => x.oninput = function () { const d = T.drafts[this.dataset.sid]; d[this.dataset.k] = this.value; d[this.dataset.k === 'auto' ? 'ea' : 'ec'] = true; saveT();
      this.previousElementSibling.outerHTML = counter(this.value, this.dataset.k === 'auto' ? LIM.autoMax : LIM.careerMax); });
    el('view').querySelectorAll('.reb').forEach((b) => b.onclick = () => { const d = T.drafts[b.dataset.sid]; d[b.dataset.k === 'auto' ? 'ea' : 'ec'] = false; saveT(); render(true); });
    el('bPrint').onclick = () => printView(list);
    el('bTbl').onclick = () => { const t = [['학번', '이름', '역할', '자율·자치활동', '진로활동']].concat(list.map((S) => [S.sid, S.name, S.role, T.drafts[S.sid].auto, T.drafts[S.sid].career])).map((r) => r.map((v) => String(v).replace(/\t|\n/g, ' ')).join('\t')).join('\n');
      navigator.clipboard && navigator.clipboard.writeText(t).then(() => alert('복사했습니다. 엑셀에 붙여 넣으세요.')); };
    el('bMd').onclick = () => download(PROGRAM.replace(/\s/g, '') + '_학생기록_원본.md', rawMd(list), 'text/markdown');
    el('bAllWipe').onclick = function () { if (this.dataset.armed !== '1') { this.dataset.armed = '1'; this.textContent = '정말 지우려면 한 번 더'; el('awNote').className = 'note warn'; el('awNote').textContent = '되돌릴 수 없습니다.'; return; }
      LAWDB.clearSignups(); LAWDB.clearReflect(); T = { obs: {}, follow: {}, drafts: {}, when: T.when }; saveT(); el('awNote').className = 'note ok'; el('awNote').textContent = '지웠습니다.'; setTimeout(() => render(true), 300); };
  }
  function printView(list) {
    const w = window.open('', '_blank'); if (!w) return;
    const byCls = {}; list.forEach((S) => { const c = R.cls(S.sid).cls; (byCls[c] = byCls[c] || []).push(S); });
    w.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>창체 특기사항 초안</title><style>@page{size:A4 landscape;margin:12mm}body{font-family:"Malgun Gothic",sans-serif;font-size:9.5pt;color:#111}h1{font-size:14pt;margin:0 0 2mm}.n{font-size:8.5pt;color:#555;margin:0 0 4mm}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:2mm;vertical-align:top;line-height:1.5}th{background:#eef2f7}section{page-break-after:always}</style></head><body>' +
      Object.keys(byCls).sort((a, b) => a - b).map((c) => '<section><h1>' + esc(PROGRAM) + ' · ' + c + '반 창체 특기사항 초안</h1><p class="n">담임 선생님께 — 교사 관찰과 학생 활동 기록으로 만든 초안입니다. 학생을 아시는 만큼 고쳐 쓰시고, 글자 수(자율·자치 ' + LIM.autoMax + '자, 진로 ' + LIM.careerMax + '자)를 확인해 주세요.</p>' +
        '<table><tr><th style="width:9%">번호</th><th style="width:8%">이름</th><th style="width:41%">자율·자치활동</th><th>진로활동</th></tr>' +
        byCls[c].map((S) => '<tr><td>' + S.sid + '<br>' + esc(S.role) + '</td><td>' + esc(S.name) + '</td><td>' + esc(T.drafts[S.sid].auto) + '</td><td>' + esc(T.drafts[S.sid].career) + '</td></tr>').join('') + '</table></section>').join('') +
      '<script>window.onload=function(){window.print()}<\/script></body></html>');
    w.document.close();
  }
  function rawMd(list) {
    let s = '# ' + PROGRAM + ' 학생 기록 원본\n\n> 기재 원칙: 교사가 직접 관찰한 내용을 바탕으로 쓰고, 학생 성찰은 보조 자료로만 씁니다. 하지 않은 일을 지어내지 않습니다. \'대회·순위·수상\' 같은 말은 쓰지 않습니다. 글자 수: 자율·자치 ' + LIM.autoMax + '자, 진로 ' + LIM.careerMax + '자.\n\n';
    list.forEach((S) => {
      const op = S.op || {};
      s += '## ' + S.sid + ' ' + S.name + ' · ' + S.role + ' (' + S.label + ', 의뢰인 ' + S.client + ')\n\n- 필수 쟁점: ' + S.must + '\n- 교사 관찰: ' + ((S.obs.tags || []).join(', ') || '없음') + (S.obs.memo ? ' / ' + S.obs.memo : '') + '\n- 후속 탐구: ' + (S.follow || '없음') +
        '\n- 근거 조문: ' + ((op.laws || []).filter((x) => x && x.name).map((x) => x.name + ' ' + x.art + ' — ' + x.mine).join(' / ') || '없음') + '\n- 나의 판단: ' + (op.judge || '') + '\n- 의뢰인 조언: ' + (op.advice || '') + '\n- 더 찾아보기: ' + (op.more || '') +
        '\n- 회의에서 한 일: ' + (S.did || '') + '\n- 받은 고마운 점: ' + (S.thanks ? S.thanks.text : '') + '\n- 희망 진로: ' + ((S.reflect && S.reflect.career) || '') + '\n- 성찰: ' + ((S.reflect && S.reflect.ans) || []).map((a, i) => (i + 1) + ') ' + a).join(' ') +
        '\n\n### 자율·자치활동 초안\n' + T.drafts[S.sid].auto + '\n\n### 진로활동 초안\n' + T.drafts[S.sid].career + '\n\n';
    });
    return s;
  }

  /* ── 설정 ── */
  function tabSet() {
    const cases = (window.LAW_CASES || []);
    let h = '<section class="card"><h2>해설</h2><p class="note">해설.json은 사이트에 올리지 않습니다. 여기서 한 번 불러오면 이 브라우저에만 저장되고, 공개한 칸만 학생 쪽으로 나갑니다.</p>' +
      '<div class="row" style="margin-top:.6rem"><span class="badge ' + (SOL ? 'ok' : 'warn') + '">' + (SOL ? '불러옴 · 사연 ' + Object.keys(SOL.cases).length + '개' : '없음') + '</span><label class="btn primary">해설 불러오기<input type="file" accept=".json,application/json" class="solFile" hidden></label>' +
      (SOL ? '<button class="btn ghost" id="bSolOff">이 브라우저에서 지우기</button>' : '') + '</div></section>';
    h += '<section class="card"><h2>조와 사연</h2><table class="t"><tr><th>조</th><th>사연</th><th>한 줄</th></tr>' + R.GROUPS.map((g, i) => { const c = R.caseOf((CFG.caseOfGroup || [1, 2, 3, 4])[i]); return '<tr><td><b>' + esc(g) + '</b></td><td>' + esc(c ? c.title : '') + '</td><td class="note">' + esc(c ? c.line : '') + '</td></tr>'; }).join('') + '</table><p class="note">바꾸려면 config.js의 caseOfGroup을 고치세요.</p></section>';
    h += '<section class="card"><h2>진행 초기화</h2><p class="note">단계·타이머·공개한 해설·의견서·보고서·회의 기록을 지웁니다. <b>참가 신청 명단과 성찰은 남습니다.</b> 리허설 뒤에 누르세요.</p><div class="row" style="margin-top:.5rem"><button class="btn danger" id="bReset">진행 초기화</button><button class="btn" id="bBackup">지금 기록 파일로 저장</button><span class="note" id="rNote"></span></div></section>';
    h += '<section class="card"><h2>연결</h2><div class="kv"><span>방 이름</span><b>' + esc(ROOM) + '</b><span>방식</span><span>' + (LAWDB.mode === 'firebase' ? '파이어베이스 (기기끼리 실시간)' : '연습 모드 — 이 브라우저의 창끼리만 이어집니다') + '</span></div></section>';
    el('view').innerHTML = h;
    el('view').querySelectorAll('.solFile').forEach((f) => f.onchange = loadSol);
    if (el('bSolOff')) el('bSolOff').onclick = () => { localStorage.removeItem(SK); SOL = null; render(true); };
    el('bReset').onclick = function () { if (this.dataset.armed !== '1') { this.dataset.armed = '1'; this.textContent = '정말 초기화하려면 한 번 더'; return; } LAWDB.clearProgress(); ST = null; PUB = null; el('rNote').className = 'note ok'; el('rNote').textContent = '초기화했습니다.'; this.dataset.armed = ''; this.textContent = '진행 초기화'; };
    el('bBackup').onclick = () => download(PROGRAM.replace(/\s/g, '') + '_기록백업_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({ room: ROOM, at: Date.now(), signup: SIGN, op: OPS, rep: REPS, thanks: THX, reflect: REF, teacher: T }, null, 1), 'application/json');
  }

  /* ── 연결 ── */
  LAWDB.onSignups((o) => { SIGN = o || {}; render(); });
  LAWDB.onState((s) => { ST = s; render(); });
  LAWDB.onPub((p) => { PUB = p; render(); });
  LAWDB.onOps((o) => { OPS = o || {}; render(); });
  LAWDB.onReps((o) => { REPS = o || {}; render(); });
  LAWDB.onThanks((o) => { THX = o || {}; render(); });
  LAWDB.onReflect((o) => { REF = o || {}; render(); });
  LAWDB.onStatus((s) => { link = s.state; render(); });
  setInterval(() => {
    if (BOARD) { boardTick(); return; }
    if (tab === 'run' && el('cClock')) { const t = st().timer, left = leftOf(t); el('cClock').textContent = t ? fmt(left) : '—'; el('cClock').className = 'clock num ' + (!t ? '' : left <= 0 ? 'zero' : left <= 60 ? 'low' : ''); }
  }, 1000);
  document.addEventListener('keydown', (e) => {
    if (BOARD || typing() || /BUTTON/.test((document.activeElement || {}).tagName || '') || tab !== 'run') return;
    if (e.code === 'Space') { e.preventDefault(); timer('toggle'); }
    if (e.key === 'ArrowRight') goStep(st().step + 1);
    if (e.key === 'ArrowLeft') goStep(st().step - 1);
  });
  if (BOARD) { el('console').hidden = true; el('board').hidden = false; document.body.classList.add('board'); document.title = '생활법률 합동상담 · 공지 화면'; }
  window.addEventListener('hashchange', () => location.reload());
  render(true);
})();
</script>
</body>
</html>
